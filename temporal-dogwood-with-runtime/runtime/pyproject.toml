[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "temporal-policy-runtime"
version = "0.1.0"
description = "AgentCore runtime for the temporal Gateway-policy demo"
requires-python = ">=3.10"
dependencies = [
    "bedrock-agentcore >= 1.9.1",
    "google-genai >= 1.0.0",
    "mcp ~= 1.24.0",
    "mcp-proxy-for-aws >= 1.1.0",
    "strands-agents >= 1.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
